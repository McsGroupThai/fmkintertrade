function renderPage(){

    '</main>'+renderFooter(t);
  applyScroll();
  observeReveal();
}
function renderLayer(){
  var t=T[state.lang];
  document.getElementById('layer').innerHTML = renderMenu(t)+renderModal(t);
  document.body.style.overflow = (state.menuOpen || state.modalOpen) ? 'hidden' : '';
}

/* ---------- interactions ---------- */
function applyScroll(){
  var h=document.getElementById('siteHeader'); if(!h) return;
  if(window.scrollY>24) h.classList.add('scrolled'); else h.classList.remove('scrolled');
}
var revealObserver;
function observeReveal(){
  var els=Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)){ els.forEach(function(el){el.classList.add('is-visible');}); return; }
  if(revealObserver) revealObserver.disconnect();
  revealObserver=new IntersectionObserver(function(ents){ ents.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('is-visible'); revealObserver.unobserve(e.target); } }); },{threshold:0.1, rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(el){ revealObserver.observe(el); });
  setTimeout(function(){ els.forEach(function(el){el.classList.add('is-visible');}); }, 1800);
}

function readForm(){
  var g=function(id){ var el=document.getElementById(id); return el?el.value:''; };
  var cm=document.querySelector('input[name="contactMethod"]:checked');
  var cc=document.querySelector('input[name="consent"]');
  state.form={ fullName:g('f-name'), company:g('f-company'), position:g('f-position'), country:g('f-country'), email:g('f-email'), phone:g('f-phone'), solution:g('f-solution'), projectType:g('f-ptype'), message:g('f-message'), contactMethod:cm?cm.value:'', consent:cc?cc.checked:false };
}
function validate(){
  var f=state.form, t=T[state.lang].form, e={};
  if(!f.fullName.trim()) e.fullName=t.errRequired;
  if(!f.company.trim()) e.company=t.errRequired;
  if(!f.email.trim()) e.email=t.errRequired; else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email=t.errEmail;
  if(!f.phone.trim()) e.phone=t.errRequired; else if(!/^[+()\d][\d\s().-]{6,}$/.test(f.phone)) e.phone=t.errPhone;
  if(!f.consent) e.consent=t.errConsent;
  return e;
}

  if(a==='lang'){ setLang(el.getAttribute('data-lang')); }
  else if(a==='open-menu'){ openMenu(); }
  else if(a==='close-menu'){ closeMenu(); }
  else if(a==='nav-close'){ closeMenu(); }
  else if(a==='open-modal'){ openModal(); }
  else if(a==='close-modal'){ closeModal(); }
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){ if(state.modalOpen) closeModal(); else if(state.menuOpen) closeMenu(); }
  if((ev.key==='Enter'||ev.key===' ') && ev.target.getAttribute && ev.target.getAttribute('data-action')==='lang'){ ev.preventDefault(); setLang(ev.target.getAttribute('data-lang')); }
});
document.addEventListener('submit', function(ev){
  if(ev.target.id!=='consultForm') return;
  ev.preventDefault();
  if(state.submitting) return;
  readForm();
  var e=validate();
  if(Object.keys(e).length){ state.errors=e; renderLayer(); return; }
  state.errors={}; state.submitting=true; renderLayer();
  /* DEMO ONLY — no backend. Replace this timeout with a real fetch() POST. */
  setTimeout(function(){ state.submitting=false; state.demoNotice=true; renderLayer(); }, 900);
});
window.addEventListener('scroll', applyScroll, {passive:true});

/* ---------- boot ---------- */
renderPage();
renderLayer();
</script>
</body>
</html>
