<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy · นโยบายความเป็นส่วนตัว | FMK Intertrade</title>
<meta name="description" content="How FMK Intertrade collects, uses and protects personal data submitted through fmkintertrade.shop, under Thailand's Personal Data Protection Act.">
<link rel="canonical" href="https://fmkintertrade.shop/privacy.html">
<meta name="theme-color" content="#0E5B91">
<link rel="icon" type="image/jpeg" href="logo-seal.jpeg">
<link rel="apple-touch-icon" href="logo-seal.jpeg">
<meta property="og:type" content="article">
<meta property="og:site_name" content="FMK Intertrade">
<meta property="og:title" content="Privacy Policy · นโยบายความเป็นส่วนตัว | FMK Intertrade">
<meta property="og:description" content="How FMK Intertrade collects, uses and protects personal data submitted through this website.">
<meta property="og:url" content="https://fmkintertrade.shop/privacy.html">
<meta property="og:image" content="https://fmkintertrade.shop/logo-full.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* หน้านี้จงใจใช้ CSS ชุดเล็กของตัวเอง ไม่ยืมของหน้าแรกมาทั้งก้อน
     เพราะหน้านโยบายเป็นเอกสารที่ต้องอ่านง่าย ไม่ต้องใช้ระบบเลย์เอาต์ของหน้าขายของ
     สีและฟอนต์ยังเป็นชุดเดียวกับหน้าแรกทุกค่า เพื่อให้รู้ว่าเป็นเว็บเดียวกัน */
  *{box-sizing:border-box}
  body{margin:0;font-family:'Manrope','Noto Sans Thai',system-ui,sans-serif;background:#F4F7F5;color:#1A1A1A;-webkit-font-smoothing:antialiased;line-height:1.7}
  a{color:#0E5B91}
  h1,h2,p,ul{margin:0}
  .wrap{width:min(1100px,100% - 40px);margin-inline:auto}
  .doc{width:min(760px,100%);margin-inline:auto}

  header{background:#fff;border-bottom:1px solid #DCE3DF;position:sticky;top:0;z-index:10}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#1A1A1A}
  .brand img{height:34px;width:auto;display:block}
  .brand b{font-size:15px;font-weight:800;letter-spacing:.04em}
  .spacer{margin-left:auto}
  .home{font-size:14px;font-weight:600;color:#0E5B91;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  .home:hover{text-decoration:underline}
  .langs{display:flex;gap:4px}
  .lang{border:1px solid #DCE3DF;background:#fff;color:#3B4148;border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer}
  .lang[aria-pressed="true"]{background:#0C2E48;border-color:#0C2E48;color:#fff}

  main{padding:clamp(40px,6vw,76px) 0}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;color:#1A1A1A;font-size:12.5px;font-weight:700;letter-spacing:.2em;margin-bottom:16px}
  .eyebrow span{width:28px;height:1px;background:#C9A050}
  h1{font-size:clamp(28px,4.4vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
  .updated{font-size:13.5px;color:#68736E;margin-top:12px}
  .intro{font-size:16.5px;color:#3B4148;margin-top:22px;padding-bottom:28px;border-bottom:1px solid #DCE3DF}

  section{margin-top:34px}
  h2{font-size:19px;font-weight:700;line-height:1.35;color:#0C2E48;text-wrap:balance}
  section p{margin-top:10px;font-size:15.5px;color:#3B4148}
  section ul{margin-top:12px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  section li{position:relative;padding-left:22px;font-size:15.5px;color:#3B4148}
  section li::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;border-radius:50%;background:#C9A050}

  footer{background:#0A2439;color:rgba(255,255,255,.65);margin-top:clamp(48px,7vw,88px);padding:40px 0 30px;font-size:13.5px}
  footer a{color:rgba(255,255,255,.65);text-decoration:none}
  footer a:hover{color:#C9A050;text-decoration:underline}
  .fgrid{display:flex;gap:32px;flex-wrap:wrap;justify-content:space-between}
  .copyright{border-top:1px solid rgba(255,255,255,.12);margin-top:28px;padding-top:20px;font-size:12.5px;color:rgba(255,255,255,.5)}

  :focus-visible{outline:2px solid #0E5B91;outline-offset:2px}
  @media print{
    header,.langs,.home{display:none}
    body{background:#fff}
    footer{background:#fff;color:#000;border-top:1px solid #ccc}
    footer a{color:#000}
  }
</style>
</head>
<body>
<div id="page"></div>

<script>
"use strict";


/*__FMK_CONTENT__*/

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ภาษาที่จะแสดง
   1. ?lang= ที่ติดมากับลิงก์ — หน้าแรกส่งภาษาที่ผู้อ่านกำลังดูอยู่มาให้
   2. ภาษาของเบราว์เซอร์
   3. ไทย เพราะผู้อ่านส่วนใหญ่ของเว็บนี้อ่านไทย และเป็นภาษาของกฎหมายที่อ้างถึง */
function initialLang(){
  var q = (location.search.match(/[?&]lang=(en|th)\b/) || [])[1];
  if(q) return q;
  var nav = (navigator.language || '').toLowerCase();
  return nav.indexOf('en') === 0 ? 'en' : 'th';
}

var lang = initialLang();

function render(){
  var t = T[lang], p = t.privacy;
  document.documentElement.lang = lang;
  document.title = p.title + ' | FMK Intertrade';

  var secs = p.sections.map(function(s){
    var body = (s.body || []).map(function(x){ return '<p>'+esc(x)+'</p>'; }).join('');
    var items = (s.items || []).length
      ? '<ul>'+s.items.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
      : '';
    return '<section><h2>'+esc(s.heading)+'</h2>'+body+items+'</section>';
  }).join('');

  document.getElementById('page').innerHTML =
    '<header><div class="wrap bar">'+
      '<a class="brand" href="index.html?lang='+lang+'">'+
        '<img src="'+esc(COMPANY.logo || 'logo-monogram.png')+'" alt="FMK Intertrade" height="34">'+
        '<b>FMK INTERTRADE</b></a>'+
      '<span class="spacer"></span>'+
      '<a class="home" href="index.html?lang='+lang+'">'+esc(p.backToHome)+'</a>'+
      '<span class="langs">'+
        '<button type="button" class="lang" data-lang="en" aria-pressed="'+(lang==='en')+'">EN</button>'+
        '<button type="button" class="lang" data-lang="th" aria-pressed="'+(lang==='th')+'">TH</button>'+
      '</span>'+
    '</div></header>'+
    '<main><div class="wrap doc">'+
      '<div class="eyebrow"><span></span>'+esc(p.eyebrow)+'</div>'+
      '<h1>'+esc(p.title)+'</h1>'+
      '<div class="updated">'+esc(p.updated)+'</div>'+
      '<p class="intro">'+esc(p.intro)+'</p>'+
      secs+
    '</div></main>'+
    '<footer><div class="wrap">'+
      '<div class="fgrid">'+
        '<div>'+esc(COMPANY.address)+'</div>'+
        '<div><a href="tel:'+esc(COMPANY.phoneHref)+'">'+esc(COMPANY.phones)+'</a></div>'+
        '<div><a href="mailto:'+esc(COMPANY.email)+'">'+esc(COMPANY.email)+'</a></div>'+
      '</div>'+
      '<div class="copyright">'+esc(t.footer.copyright)+'</div>'+
    '</div></footer>';
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-lang]');
  if(!b) return;
  var next = b.getAttribute('data-lang');
  if(next === lang) return;
  lang = next;
  /* เปลี่ยน ?lang= ในแถบที่อยู่ด้วย เพื่อให้ผู้อ่านคัดลอกลิงก์ส่งต่อได้ตรงภาษาที่เห็น
     ใช้ replaceState เพื่อไม่ให้ปุ่มย้อนกลับของเบราว์เซอร์เต็มไปด้วยการสลับภาษา */
  try { history.replaceState(null, '', 'privacy.html?lang=' + lang); } catch(e){}
  render();
});

render();
</script>
</body>
</html>
